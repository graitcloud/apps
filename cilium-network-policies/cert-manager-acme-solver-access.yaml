# =============================================================================
# EXTERNAL LABEL DEPENDENCIES
# =============================================================================
# This policy selects endpoints using labels that must be applied externally
# (i.e. via Helm values, not by this manifest). If these labels are missing,
# Cilium will silently drop traffic and ACME HTTP-01 challenges will fail
# with 504 Gateway Timeout.
#
# 1. ingress-nginx NAMESPACE must have:
#      access: restricted
#    (Set via namespaceLabels in nginx-ingress Helm values.yaml)
#
# 2. ingress-nginx controller PODS must have:
#      padmini.systems/network-permission: allow
#      padmini.systems/tenant-resource-type: ingress
#    (Set via podLabels in nginx-ingress Helm values.yaml)
#
# Verify with:
#   kubectl get ns ingress-nginx --show-labels | grep access
#   kubectl get pods -n ingress-nginx --show-labels | grep padmini
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cert-manager-acme-solver-access
  labels:
    managed-by: platform
    component: cert-manager
    priority: high
  annotations:
    description: "High-priority policy to allow ingress controllers to access ACME HTTP solver pods on port 8089 for certificate validation"
spec:
  # Target ACME HTTP solver pods in restricted namespaces
  endpointSelector:
    matchExpressions:
      - key: acme.cert-manager.io/http01-solver
        operator: In
        values: ["true"]
      - key: io.cilium.k8s.namespace.labels.access
        operator: In
        values: ["restricted"]

  ingress:
    # Allow ingress controllers to access ACME HTTP solver pods on port 8089
    - fromEndpoints:
        - matchLabels:
            padmini.systems/tenant-resource-type: ingress
            padmini.systems/network-permission: allow
          matchExpressions:
            - key: io.cilium.k8s.namespace.labels.access
              operator: In
              values: ["restricted"]
      toPorts:
        - ports:
            - port: "8089"
              protocol: TCP